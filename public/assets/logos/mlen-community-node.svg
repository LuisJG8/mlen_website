<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">MLEN community node logo direction</title>
  <desc id="desc">A central code node connected to simplified community members.</desc>
  <defs>
    <style>
      .ink { fill: #0a1020; }
      .muted { fill: #51627f; }
      .cyan { fill: #06b6d4; }
      .lime { fill: #84cc16; }
      .line { fill: none; stroke: #93a4bd; stroke-width: 6; stroke-linecap: round; }
      .word { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 800; letter-spacing: 2px; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: 1.6px; }
    </style>
  </defs>

  <g transform="translate(72 34)">
    <path class="line" d="M152 138 L68 76 M152 138 L70 208 M152 138 L222 42 M152 138 L250 216 M152 138 L286 116" />
    <circle fill="#eef7fb" cx="152" cy="138" r="57" />
    <circle class="cyan" cx="152" cy="138" r="45" />
    <text class="word" x="152" y="153" text-anchor="middle" font-size="36" fill="#ffffff">&lt;/&gt;</text>

    <g class="ink">
      <circle cx="68" cy="58" r="22" />
      <path d="M28 109c6-28 24-43 40-43s34 15 40 43z" />
      <circle cx="70" cy="204" r="22" />
      <path d="M30 255c6-28 24-43 40-43s34 15 40 43z" />
      <circle cx="222" cy="38" r="22" />
      <path d="M182 89c6-28 24-43 40-43s34 15 40 43z" />
      <circle cx="250" cy="214" r="22" />
      <path d="M210 265c6-28 24-43 40-43s34 15 40 43z" />
      <circle cx="286" cy="110" r="22" />
      <path d="M246 161c6-28 24-43 40-43s34 15 40 43z" />
    </g>
    <circle class="lime" cx="68" cy="58" r="8" />
    <circle class="cyan" cx="70" cy="204" r="8" />
    <circle class="lime" cx="222" cy="38" r="8" />
    <circle class="cyan" cx="250" cy="214" r="8" />
    <circle class="lime" cx="286" cy="110" r="8" />
  </g>

  <g transform="translate(405 143)">
