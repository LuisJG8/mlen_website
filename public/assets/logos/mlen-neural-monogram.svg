<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">MLEN neural monogram logo direction</title>
  <desc id="desc">A minimal MLEN wordmark with an M-shaped neural network mark.</desc>
  <defs>
    <style>
      .ink { fill: #0a1020; }
      .muted { fill: #51627f; }
      .cyan { fill: #06b6d4; }
      .lime { fill: #84cc16; }
      .line { fill: none; stroke: #0a1020; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: #06b6d4; stroke-width: 7; stroke-linecap: round; }
      .word { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 800; letter-spacing: 3px; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <g transform="translate(64 64)">
    <path class="line" d="M12 192 L70 48 L132 172 L196 48 L254 192" />
    <path class="accent" d="M70 48 L132 172 L196 48" />
    <circle class="ink" cx="12" cy="192" r="19" />
    <circle class="cyan" cx="70" cy="48" r="21" />
    <circle class="ink" cx="132" cy="172" r="18" />
    <circle class="lime" cx="196" cy="48" r="21" />
    <circle class="ink" cx="254" cy="192" r="19" />
    <circle fill="#ffffff" cx="70" cy="48" r="7" />
    <circle fill="#ffffff" cx="196" cy="48" r="7" />
  </g>

  <g transform="translate(370 126)">
    <text class="word ink" x="0" y="0" font-size="74">MLEN</text>
    <text class="sub muted" x="3" y="44" font-size="15">MACHINE LEARNING</text>
    <text class="sub muted" x="3" y="68" font-size="15">ENGINEERING NETWORK</text>
  </g>
</svg>
