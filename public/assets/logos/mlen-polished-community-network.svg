<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">MLEN polished community network logo</title>
  <desc id="desc">A simplified neural network logo with abstract machine learning engineers connected around a central code node.</desc>
  <defs>
    <style>
      .ink { fill: #0a1020; }
      .muted { fill: #52627a; }
      .panel { fill: #ffffff; }
      .soft { fill: #f4f8ff; }
      .cyan { fill: #06b6d4; }
      .lime { fill: #84cc16; }
      .line {
        fill: none;
        stroke: #8fa0b7;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line-primary {
        fill: none;
        stroke: #06b6d4;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .avatar-body { fill: #0a1020; }
      .avatar-head { fill: #ffffff; stroke: #0a1020; stroke-width: 7; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.12em;
      }
      .wordmark {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 64px;
        font-weight: 850;
        letter-spacing: 0.035em;
      }
      .subtitle {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 15px;
        font-weight: 760;
        letter-spacing: 0.22em;
