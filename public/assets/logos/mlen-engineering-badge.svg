<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">MLEN engineering badge logo direction</title>
  <desc id="desc">A compact engineering badge with a connected network and MLEN wordmark.</desc>
  <defs>
    <style>
      .ink { fill: #0a1020; }
      .muted { fill: #51627f; }
      .cyan { fill: #06b6d4; }
      .lime { fill: #84cc16; }
      .ring { fill: none; stroke: #0a1020; stroke-width: 12; stroke-linejoin: round; }
      .line { fill: none; stroke: #06b6d4; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .word { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 850; letter-spacing: 2px; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: 1.4px; }
    </style>
  </defs>

  <g transform="translate(70 42)">
    <path class="ring" d="M136 6 L248 72 L248 204 L136 270 L24 204 L24 72 Z" />
    <path class="line" d="M72 182 L136 86 L198 182 M89 128 L182 128" />
    <circle class="ink" cx="72" cy="182" r="18" />
    <circle class="cyan" cx="136" cy="86" r="20" />
    <circle class="ink" cx="198" cy="182" r="18" />
    <circle class="lime" cx="89" cy="128" r="15" />
    <circle class="lime" cx="182" cy="128" r="15" />
    <text class="word ink" x="136" y="228" text-anchor="middle" font-size="42">ML</text>
  </g>

  <g transform="translate(385 123)">
    <text class="word ink" x="0" y="0" font-size="70">MLEN</text>
    <text class="sub muted" x="3" y="44" font-size="15">ENGINEERING</text>
    <text class="sub muted" x="3" y="68" font-size="15">COMMUNITY NETWORK</text>
  </g>
</svg>
