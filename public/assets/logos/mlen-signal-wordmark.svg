<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">MLEN signal wordmark logo direction</title>
  <desc id="desc">A clean MLEN wordmark with a connected signal mark for community and engineering.</desc>
  <defs>
    <style>
      .ink { fill: #0a1020; }
      .muted { fill: #51627f; }
      .cyan { fill: #06b6d4; }
      .lime { fill: #84cc16; }
      .line { fill: none; stroke: #0a1020; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: #06b6d4; stroke-width: 7; stroke-linecap: round; }
      .word { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 850; letter-spacing: 2px; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <g transform="translate(84 92)">
    <text class="word ink" x="0" y="89" font-size="112">MLEN</text>
    <path class="line" d="M9 134 H121 L178 77 L236 134 H335" />
    <path class="accent" d="M121 134 L178 77 L236 134" />
    <circle class="cyan" cx="121" cy="134" r="15" />
    <circle class="lime" cx="178" cy="77" r="17" />
    <circle class="cyan" cx="236" cy="134" r="15" />
    <circle class="ink" cx="335" cy="134" r="13" />
    <text class="sub muted" x="6" y="182" font-size="16">MACHINE LEARNING ENGINEERING NETWORK</text>
  </g>
</svg>
