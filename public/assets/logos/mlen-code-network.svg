<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">MLEN code network logo direction</title>
  <desc id="desc">Angle brackets connected into a minimal machine learning network.</desc>
  <defs>
    <style>
      .ink { fill: none; stroke: #0a1020; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .cyan-stroke { fill: none; stroke: #06b6d4; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .cyan { fill: #06b6d4; }
      .lime { fill: #84cc16; }
      .text-ink { fill: #0a1020; }
      .muted { fill: #51627f; }
      .word { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 850; letter-spacing: 2px; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <g transform="translate(70 72)">
    <path class="ink" d="M96 30 L28 108 L96 186" />
    <path class="ink" d="M220 30 L288 108 L220 186" />
    <path class="cyan-stroke" d="M114 73 L174 53 L210 108 L174 163 L114 143 L114 73" />
    <circle class="cyan" cx="114" cy="73" r="16" />
    <circle class="lime" cx="174" cy="53" r="16" />
    <circle class="cyan" cx="210" cy="108" r="16" />
    <circle class="lime" cx="174" cy="163" r="16" />
    <circle class="cyan" cx="114" cy="143" r="16" />
  </g>

  <g transform="translate(405 126)">
    <text class="word text-ink" x="0" y="0" font-size="70">MLEN</text>
    <text class="sub muted" x="2" y="44" font-size="15">MACHINE LEARNING</text>
    <text class="sub muted" x="2" y="68" font-size="15">ENGINEERING NETWORK</text>
  </g>
</svg>
